[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rbfopt-test"
version = "0.1.0"
description = "Benchmark and test suite for the RBFopt optimization library (alpine and other benchmark functions)"
authors = [
    { name = "Albert Lee" },
    { name = "David E. Bernal Neira" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rbfopt>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=1.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipython>=8.0",
]
bam = [
    "bam-solver>=4.0.0",
]
fmqa = [
    "torch==2.8.0",
    "numpy==2.2.6",
    "dimod==0.12.21",
    "dwave-samplers==1.6.0",
    "scipy==1.15.3",
    "pandas==2.2.3",
    "matplotlib==3.10.3",
]
gdp = [
    "pyomo>=6.10,<6.11",
    "sympy>=1.13,<2",
    "networkx>=3.0",
]
lint = [
    "ruff>=0.4.0",
]
test = [
    "pytest>=7.0",
]

[tool.ruff]
extend-exclude = ["fmqa_benchmark/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
py-modules = [
    "benchmark",
    "benchmark_analysis",
    "case_study_analysis",
    "case_study_benchmark",
    "grid_dsda",
    "grid_rbfopt",
    "instrumentation",
    "evaluation_trace",
    "trace_analysis",
    "timing_analysis",
]
packages = [
    "fmqa_benchmark",
    "gdp_models",
    "benchmark_grids",
    "case_studies",
    "case_study_data",
    "case_study_data.column",
    "case_study_data.cstr",
    "case_study_data.small_batch",
]

[tool.setuptools.package-data]
benchmark_grids = ["*.csv", "README.md"]
"case_study_data.column" = ["*.csv"]
"case_study_data.cstr" = ["*.csv"]
"case_study_data.small_batch" = ["*.csv"]

fmqa_benchmark = ["vendor/qhd/provenance.json", "vendor/qhd/LICENSE.SECQUOIA", "vendor/qhd/fmqa/LICENSE", "vendor/qhd/fmqa/setup.py", "vendor/qhd/fmqa/fmqa/*.py", "vendor/qhd/bbo_via_fmqa/*.py"]
