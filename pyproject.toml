[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rbfopt-test"
version = "0.1.0"
description = "RBFopt optimization tests with alpine and other benchmark functions"
requires-python = ">=3.10"
dependencies = [
    "rbfopt>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=1.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipython>=8.0",
]
