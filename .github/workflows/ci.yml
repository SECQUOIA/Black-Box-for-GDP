name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Include stacked follow-ups to PR #52 before that branch merges into main.
    branches: [main, review/cstr15-dantzig-results]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[lint]"

      - name: Run Ruff
        run: python -m ruff check benchmark.py benchmark_analysis.py case_study_benchmark.py case_study_analysis.py timing_analysis.py nlp_cost_analysis.py enumerate_process_ipopt.py enumerate_column_ipopt.py enumerate_dynamic_ipopt.py build_column_dynamic_ipopt.py measure_cstr30_structural_rejections.py grid_dsda.py grid_rbfopt.py instrumentation.py cstr30_retry.py cpu_affinity.py gdp_compare.py gdp_comparison_analysis.py fmqa_benchmark_runner.py fmqa_grid_benchmark.py fmqa_compare.py result_archives.py results/grid_trace_rbfopt_20261010/verify_archive.py fmqa_benchmark review_comparison review_diagnostics case_studies gdp_models tests scripts ipopt_dfo_cstr.py ipopt_dfo_non_cstr.py build_ipopt_dfo_cstr.py build_ipopt_dfo_non_cstr.py

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # The archived GDPopt regression profile requires Pyomo 6.10.0.
          python -m pip install -r requirements-gdp.txt ".[test,gdp]"

      - name: Run pytest
        run: python -m pytest tests/ -q

  gdp-minimal-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and write original NLPs with only server dependencies
        run: |
          python -m venv /tmp/gdp-minimal-runtime
          /tmp/gdp-minimal-runtime/bin/python -m pip install -r requirements-gdp.txt
          /tmp/gdp-minimal-runtime/bin/python -m gdp_models.preflight

  fmqa-cpu-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify FMQA in the standalone CPU environment
        run: |
          export FMQA_REPOSITORY="$GITHUB_WORKSPACE"
          export FMQA_QHD_ENV="$RUNNER_TEMP/fmqa-qhd"
          export FMQA_QHD_BASE_PYTHON="$(command -v python)"
          export FMQA_QHD_CPU="$(python -c 'import os; print(min(os.sched_getaffinity(0)))')"
          bash run_fmqa_qhd_dantzig.sh setup --allow-other-host
          "$FMQA_QHD_ENV/bin/python" -m pip install pytest
          "$FMQA_QHD_ENV/bin/python" fmqa_benchmark_runner.py check --allow-other-host
          "$FMQA_QHD_ENV/bin/python" fmqa_grid_benchmark.py check --allow-other-host
          "$FMQA_QHD_ENV/bin/python" -m pytest tests/test_fmqa_benchmark.py tests/test_fmqa_qhd.py tests/test_fmqa_publication.py tests/test_fmqa_setup.py -q

  fmqa-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned CPU FMQA dependencies
        run: |
          python -m pip install "$(sed -n '/^torch==/p' requirements-fmqa-qhd.txt)" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[test,fmqa]"
      - name: Validate the adapter and upstream core
        run: |
          python -c 'import torch, dimod; from dwave.samplers import SimulatedAnnealingSampler; print(torch.__version__)'
          python -m pytest tests/test_fmqa_adapter.py tests/test_ipopt_fmqa_settings.py -q

  fmqa-python-compatibility:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.actor == 'dependabot[bot]' ||
      startsWith(github.head_ref, 'dependabot/')
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned CPU FMQA dependencies
        run: |
          python -m pip install "$(sed -n '/^torch==/p' requirements-fmqa-qhd.txt)" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[test,fmqa]"
          python -m pip check
      - name: Exercise native training and public adapter
        run: |
          python -c 'import torch, dimod; from dwave.samplers import SimulatedAnnealingSampler; print(torch.__version__)'
          python -m pytest tests/test_fmqa_adapter.py tests/test_ipopt_fmqa_settings.py tests/test_fmqa_setup.py -q
