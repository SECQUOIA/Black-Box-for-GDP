name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[lint]"

      - name: Run Ruff
        run: python -m ruff check benchmark.py benchmark_analysis.py case_study_benchmark.py case_study_analysis.py timing_analysis.py nlp_cost_analysis.py grid_dsda.py grid_rbfopt.py instrumentation.py cstr30_retry.py cpu_affinity.py gdp_compare.py gdp_comparison_analysis.py fmqa_benchmark_runner.py fmqa_grid_benchmark.py fmqa_compare.py fmqa_benchmark case_studies gdp_models tests scripts

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,gdp]"

      - name: Run pytest
        run: python -m pytest tests/ -q

  gdp-minimal-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and write original NLPs with only server dependencies
        run: |
          python -m venv /tmp/gdp-minimal-runtime
          /tmp/gdp-minimal-runtime/bin/python -m pip install -r requirements-gdp.txt
          /tmp/gdp-minimal-runtime/bin/python -m gdp_models.preflight

  fmqa-cpu-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify FMQA in the standalone CPU environment
        run: |
          python -m pip install -r requirements-fmqa.txt pytest
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python fmqa_benchmark_runner.py check --allow-other-host
          python fmqa_grid_benchmark.py check --allow-other-host
          python -m pytest tests/test_fmqa_benchmark.py tests/test_fmqa_qhd.py tests/test_fmqa_publication.py -q
